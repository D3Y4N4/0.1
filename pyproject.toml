[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrotune"
version = "0.1.0"
description = "A Winamp-inspired terminal music player for local files, streams, media servers, and online radio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RetroTune contributors" }]
keywords = ["terminal", "music", "player", "winamp", "radio", "streaming"]
classifiers = [
  "Environment :: Console :: Curses",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.scripts]
retrotune = "retrotune.cli:main"

[project.optional-dependencies]
streaming = ["yt-dlp>=2026.1.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
